<title>Wild Survivor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Bebas Neue';src:url('fonts/bebas-neue-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Barlow';src:url('fonts/barlow-500.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Barlow';src:url('fonts/barlow-700.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Barlow';src:url('fonts/barlow-800.woff2') format('woff2');font-weight:800 900;font-display:swap}
/* Layout: full-bleed 3D canvas; HUD pinned to safe-area edges; decision banner top-centre; bottom-sheet menus */
:root{
  --ink:#f6f3e7; --muted:#b9c8b4; --panel:#10221a; --panel-2:#1a3326; --leaf:#7bd389; --amber:#ffb02e;
  --blood:#ff4d4d; --tiger:#ff8a1f; --shade:#06100bcc; --water:#4cc3ff; --power:#b98cff;
  --display:'Bebas Neue','Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --glass:rgba(6,14,10,.52); --edge:rgba(255,255,255,.09);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:#0b1510;color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#c0150fcc 100%);opacity:0;transition:opacity .25s}
#flash{position:fixed;inset:0;pointer-events:none;background:#ff2a1a;opacity:0}
#flash.on{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
.hud{position:fixed;inset:0;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:8px}
.hud[hidden]{display:none!important}
.hud-top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bars{display:flex;flex-direction:column;gap:6px;background:var(--glass);padding:8px 11px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--edge);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}
.bar .lbl{width:18px;height:18px;display:grid;place-items:center}
.bar .lbl svg{width:16px;height:16px}
.track{width:104px;height:7px;border-radius:99px;background:#ffffff22;overflow:hidden}
.track i{display:block;height:100%;width:100%;border-radius:inherit;transition:width .2s}
.hp i{background:var(--blood)} .en i{background:var(--amber)} .wa i{background:var(--water)}
.bar.low{animation:blink .6s infinite}
@keyframes blink{50%{opacity:.35}}
.stats{text-align:right;background:var(--glass);padding:6px 12px 7px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--edge);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dist{font-family:var(--display);font-size:38px;line-height:.95;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.dist small{font-size:13px;margin-left:2px}
.coins{font-size:13px;font-weight:800;color:var(--amber);display:flex;align-items:center;justify-content:flex-end;gap:4px}
.pause{pointer-events:auto;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);color:var(--ink);border:none;border-radius:12px;width:40px;height:40px;font:900 15px var(--body);cursor:pointer}
.tiger{display:flex;align-items:center;gap:8px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);padding:4px 10px;border-radius:99px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--tiger)}
.tiger .track{width:120px}
.tiger i{background:var(--tiger)}
.tiger.close{animation:blink .5s infinite;color:var(--blood)}
.banner{margin-top:6px;background:var(--shade);border:2px solid var(--amber);border-radius:16px;padding:10px 16px 12px;text-align:center;max-width:320px;animation:drop .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
.b-title{font-family:var(--display);font-size:28px;letter-spacing:.04em;color:var(--amber)}
.b-hint{font-size:13px;font-weight:700;margin-top:2px}
.b-track{height:6px;margin-top:8px;background:#ffffff22;border-radius:99px;overflow:hidden}
.b-track i{display:block;height:100%;background:var(--amber);border-radius:inherit}
.toast{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-family:var(--display);font-size:40px;letter-spacing:.04em;text-align:center;text-shadow:0 3px 0 #000a,0 0 18px #000;opacity:0;pointer-events:none;white-space:nowrap}
.toast small{display:block;font-family:var(--body);font-weight:900;font-size:14px;margin-top:4px}
.toast.show{animation:toast 1.5s ease-out forwards}
.toast.good{color:var(--leaf)} .toast.mid{color:var(--amber)} .toast.bad{color:var(--blood)} .toast.info{color:var(--ink)}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);background:var(--shade);padding:8px 14px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;transition:opacity .6s}
.sheet{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));z-index:10}
.sheet.center{top:0;align-items:center;background:#06100b99}
.card{width:min(440px,100%);box-sizing:border-box;background:linear-gradient(180deg,rgba(26,51,38,.92),rgba(8,18,13,.96));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:22px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:9px;box-shadow:0 -10px 40px #0009,inset 0 0 0 1px #ffffff12;animation:up .35s cubic-bezier(.2,.9,.3,1.1);max-height:calc(100vh - 40px);overflow:auto}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.logo{font-family:var(--display);font-size:46px;letter-spacing:.03em;line-height:1;margin:0;text-align:center;color:var(--ink);text-shadow:0 4px 0 #0007}
.logo span{background:linear-gradient(180deg,#ffd27a,#ff8a1f 55%,#d9500c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #ff8a1f55)}
.tag{margin:0;text-align:center;font-weight:900;font-size:12px;letter-spacing:.3em;color:var(--leaf)}
.pickrow{display:flex;flex-direction:column;gap:6px}
.pickrow .lb{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.swatches{display:flex;gap:8px}
.sw{flex:1;border:none;border-radius:12px;padding:8px 4px;background:var(--panel);color:var(--ink);font:700 12px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:inset 0 0 0 2px #ffffff14}
.sw .dot{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 #0004}
.sw[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--leaf);background:#21402f}
.skin .sw{padding:6px}
.go{border:none;border-radius:16px;padding:14px 16px 12px;font-family:var(--display);font-size:30px;letter-spacing:.08em;background:linear-gradient(180deg,#ffb54d,#ff7a12);color:#2a1205;box-shadow:0 5px 0 #a8500c,0 10px 28px #ff7a1255;cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #a8500c}
.go.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px #ffffff30;font-size:22px}
.ctl{margin:0;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.best{margin:0;text-align:center;font-size:13px;font-weight:700;color:var(--amber)}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:38px;letter-spacing:.03em;text-align:center;text-wrap:balance}
.cause{margin:0;text-align:center;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}
.grid div{background:var(--panel);border-radius:12px;padding:9px 12px}
dt{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
dd{margin:2px 0 0;font-family:var(--display);font-size:28px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
.btns .go{flex:1}
.mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(14px,env(safe-area-inset-right,0px));z-index:11;background:var(--shade);color:var(--ink);border:none;border-radius:99px;padding:8px 12px;font:900 12px var(--body);cursor:pointer}
button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.powers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pchip{display:flex;flex-direction:column;gap:3px;background:var(--shade);border:1px solid var(--pc);color:var(--pc);border-radius:10px;padding:4px 8px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;min-width:70px}
.pchip b{font-weight:900}
.pchip .pt{height:3px;border-radius:2px;background:#ffffff22;overflow:hidden}
.pchip .pt i{display:block;height:100%;background:var(--pc)}
.charsel{display:flex;align-items:center;gap:8px}
.arrow{flex:0 0 44px;height:56px;border:none;border-radius:14px;background:var(--panel);color:var(--ink);font:900 26px var(--body);cursor:pointer;box-shadow:inset 0 0 0 2px #ffffff14}
.cinfo{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:3px}
.cname{font-family:var(--display);font-size:30px;letter-spacing:.04em}
.cdesc{font-size:12.5px;color:var(--muted);line-height:1.35}
.clock{font-size:12px;font-weight:900;color:var(--amber)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wallet{font-weight:900;font-size:13px;color:var(--amber);background:var(--panel);padding:5px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.small-btn{border:none;border-radius:99px;background:var(--panel);color:var(--muted);font:900 12px var(--body);padding:6px 10px;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff14}
.missions{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.missions li{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700}
.missions li .mk{flex:0 0 18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--muted)}
.missions li.done .mk{background:var(--leaf);box-shadow:none}
.missions li .mr{margin-left:auto;color:var(--amber);font-size:11px;font-weight:900}
.lb2{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.go[disabled]{opacity:.5;cursor:not-allowed}
#mute{display:none!important}
.tr-r{display:flex;gap:6px}
.mis-btn{display:flex;justify-content:space-between;align-items:center;border:none;border-radius:12px;background:var(--panel);color:var(--muted);font:800 13px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;cursor:pointer;box-shadow:inset 0 0 0 1px #ffffff14}
.mis-btn b{color:var(--amber)}
.modes{display:flex;gap:6px}
.mode{flex:1;border:none;border-radius:12px;padding:8px 4px;background:var(--panel);color:var(--ink);font:800 12px var(--body);cursor:pointer;box-shadow:inset 0 0 0 2px #ffffff14;display:flex;flex-direction:column;align-items:center;gap:2px}
.mode small{font-weight:700;font-size:10px;color:var(--muted)}
.mode[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--tiger);background:#2a2214}
.lbx{position:fixed;left:0;right:0;height:0;background:#000;z-index:9;pointer-events:none;transition:height .55s cubic-bezier(.4,0,.2,1)}
#lbxT{top:0}#lbxB{bottom:0}
.cine .lbx{height:11vh}
.skip{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);z-index:12;font:700 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#fff9;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>

<canvas id="c"></canvas>
<canvas id="lines"></canvas><div id="vignette"></div><div id="flash"></div>
<div class="lbx" id="lbxT"></div><div class="lbx" id="lbxB"></div><div class="skip" id="skipHint" hidden>Tap to skip</div>

<div class="hud" id="hud" hidden>
  <div class="hud-top">
    <div class="bars">
      <div class="bar hp" id="hpBar"><span class="lbl" title="Health"><svg viewBox="0 0 24 24" fill="#ff4d4d" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.6.7-1.4 2.2-2.6 4.3-2.6 3.7 0 5.9 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></span><div class="track"><i id="hpFill"></i></div></div>
      <div class="bar en" id="enBar"><span class="lbl" title="Energy"><svg viewBox="0 0 24 24" fill="#ffb02e" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg></span><div class="track"><i id="enFill"></i></div></div>
      <div class="bar wa" id="waBar"><span class="lbl" title="Water"><svg viewBox="0 0 24 24" fill="#4cc3ff" aria-hidden="true"><path d="M12 2s-6.5 7.6-6.5 12.1A6.5 6.5 0 0 0 12 20.6a6.5 6.5 0 0 0 6.5-6.5C18.5 9.6 12 2 12 2z"/></svg></span><div class="track"><i id="waFill"></i></div></div>
    </div>
    <div class="stats"><div class="dist" id="dist">0<small>m</small></div><div class="coins" id="coins">0 coins</div></div>
    <button class="pause" id="pauseBtn" type="button" aria-label="Pause">II</button>
  </div>
  <div class="tiger" id="tigerWrap"><span>Tiger</span><div class="track"><i id="tgFill"></i></div></div>
  <div class="powers" id="powers"></div>
  <div class="banner" id="banner" hidden><div class="b-title" id="bTitle"></div><div class="b-hint" id="bHint"></div><div class="b-track"><i id="bFill"></i></div></div>
</div>
<div class="toast" id="toast"></div>
<div class="hint" id="ctrlHint" hidden>Swipe ← → lanes · ↑ jump · ↓ slide</div>
<button class="mute" id="mute" type="button">Sound on</button>

<div class="sheet" id="menu">
  <div class="card">
    <h1 class="logo">WILD <span>SURVIVOR</span></h1>
    <div class="toprow"><span class="wallet" id="wallet">0 coins</span><span class="tr-r"><button class="small-btn" id="mute3" type="button">Sound on</button><button class="small-btn" id="gfxBtn" type="button">Graphics: High</button></span></div>
    <div class="charsel"><button class="arrow" id="prevC" type="button" aria-label="Previous character">‹</button><div class="cinfo"><div class="cname" id="cName">Ranger</div><div class="cdesc" id="cDesc"></div><div class="clock" id="cLock" hidden></div></div><button class="arrow" id="nextC" type="button" aria-label="Next character">›</button></div>
    <div class="modes" id="modes"></div>
    <p class="best" id="loadLine">Loading survivors…</p>
    <div class="pickrow" id="rowOutfit" hidden><span class="lb">Outfit</span><div class="swatches" id="outfits"></div></div>
    <div class="pickrow skin" id="rowSkin" hidden><span class="lb">Skin</span><div class="swatches" id="skins"></div></div>
    <button class="go" id="play" type="button">RUN</button>
    <button class="mis-btn" id="misBtn" type="button" aria-expanded="false"><span id="misLbl">Missions</span><span aria-hidden="true">▾</span></button>
    <ul class="missions" id="missions" hidden></ul>
    <p class="best" id="bestLine" hidden></p>
  </div>
</div>
<div class="sheet center" id="pauseSheet" hidden>
  <div class="card"><h2>Paused</h2><button class="go" id="resume" type="button">Resume</button><div class="btns"><button class="go ghost" id="restart" type="button">Restart</button><button class="go ghost" id="quit" type="button">Menu</button></div><div class="btns"><button class="go ghost" id="mute2" type="button">Sound on</button><button class="go ghost" id="gfx2" type="button">Graphics: High</button></div></div>
</div>
<div class="sheet" id="over" hidden>
  <div class="card">
    <h2 id="overTitle">Caught</h2>
    <p class="cause" id="overCause"></p>
    <dl class="grid">
      <div><dt>Distance</dt><dd id="oDist">0 m</dd></div>
      <div><dt>Survived</dt><dd id="oTime">0s</dd></div>
      <div><dt>Coins</dt><dd id="oCoins">0</dd></div>
      <div><dt>Good calls</dt><dd id="oDec">0/0</dd></div>
    </dl>
    <p class="best" id="oBest"></p>
    <p class="cause" id="oMis"></p>
    <div class="btns"><button class="go" id="again" type="button">RUN AGAIN</button><button class="go ghost" id="toMenu" type="button">Menu</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
function seeded(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let gr = Math.random;                       /* gameplay randomness: seeded in Daily mode */
const grnd = n => Math.floor(gr() * n), gpick = a => a[grnd(a.length)];
function gshuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = grnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const dayNo = () => { const d = new Date(); return Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(2026, 9, 30)) / 864e5) + 1; };
const LANES = [-2.2, 0, 2.2];
const PI = Math.PI;

/* ================= renderer + scene ================= */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
/* Curved world: every vertex is pushed sideways/up by its squared distance from the camera,
   so the straight trail reads as winding left/right and over hills (gameplay stays straight). */
const BEND = {value: new THREE.Vector2(0, 0)};
THREE.ShaderChunk.logdepthbuf_pars_vertex = 'uniform vec2 uBend;\n' + THREE.ShaderChunk.logdepthbuf_pars_vertex;
THREE.ShaderChunk.project_vertex = THREE.ShaderChunk.project_vertex.replace('gl_Position = projectionMatrix * mvPosition;',
  'float bendD = max(-mvPosition.z - 6.0, 0.0);\nmvPosition.x += uBend.x * bendD * bendD;\nmvPosition.y += uBend.y * bendD * bendD;\ngl_Position = projectionMatrix * mvPosition;');
THREE.Material.prototype.onBeforeCompile = function (sh){ sh.uniforms.uBend = BEND; };
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 230);
const hemi = new THREE.HemisphereLight(0xdff0ff, 0x24361a, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 0.85); scene.add(sun); scene.add(sun.target);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, {left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 45}); sun.shadow.bias = -0.0015;
const torch = new THREE.PointLight(0xffc477, 0, 20, 1.6); scene.add(torch);

const GradeShader = {
  uniforms: {tDiffuse: {value: null}, exposure: {value: 1.0}, vig: {value: .42}, warm: {value: .5}, sat: {value: 1.16}, time: {value: 0}, danger: {value: 0}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float exposure, vig, warm, sat, time, danger; varying vec2 vUv;
    vec3 aces(vec3 x){ x *= .6; return clamp((x * (2.51 * x + .03)) / (x * (2.43 * x + .59) + .14), 0., 1.); }
    float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + time) * 43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb * exposure * 1.3;
      c = aces(c);
      c = mix(c, c * c * (3. - 2. * c), .45);
      float l = dot(c, vec3(.299, .587, .114));
      c = mix(vec3(l), c, sat);

/* Fill the stretch after each obstacle group with a continuous coin line (Subway Surfers style):

function fillGap(z, len){
  const z0 = z + 1.5; let z1 = z - len + 2.5;
  for (const e of events) if (e.z0 + 18 < z0 && e.z0 + 18 > z1) z1 = e.z0 + 18;   // stop before a fork so coins never lead into a danger lane
  const inWin = o => !o.done && o.z <= z0 + 1 && o.z >= z1 - 1;
  const blocked = l => obs.some(o => inWin(o) && o.lane === l && o.need === 'avoid') || obs.some(o => o.type === 'boar' && !o.done && o.lane === l && o.z > z1 - 12);
  const lanes = [0, 1, 2].filter(l => !blocked(l));
  if (!lanes.length) return;
  let lane = lanes.includes(S.coinLane) && gr() < .7 ? S.coinLane : gpick(lanes);
  S.coinLane = lane;
  const line = (l, from, to, withFruit) => {
    const n = Math.max(0, Math.floor((from - to) / 1.35));
    const fruitAt = withFruit ? 2 + grnd(Math.max(1, n - 4)) : -1;
    for (let i = 0; i < n; i++){
      const zi = from - i * 1.35;
      addItem(i === fruitAt ? supply() : 'coin', l, zi);
      const it = items[items.length - 1];
      for (const o of obs){
        if (!inWin(o) || (o.lane !== l && o.lane >= 0)) continue;
        const d = Math.abs(zi - o.z);
        if (o.need === 'jump' && d < 2.6) it.y0 = 1 + 1.45 * (1 - (d / 2.6) * (d / 2.6));
        else if (o.need === 'slide' && d < 1.8) it.y0 = .45;
      }
      if (it.y0) it.g.position.y = it.y0;
    }

  if (others.length && gr() < .38){ const l2 = gpick(others), mid = (z0 + z1) / 2; line(l2, mid + 4, z1, gr() < .5); }

}

        if (role !== 'safe') S.lastHitDist = S.dist;
        if (role === 'safe' && ev.type === 'river') S.st.river++;
        if (role === 'safe' && ev.type === 'fire') S.st.fire++;
        if (role === 'safe'){ S.decGood++; S.gap = Math.min(100, S.gap + 12); S.coins += 5; toast(E.good, '+5 coins · tiger falls back', 'good'); sfx.good(); buzz(20); }
        else if (role === 'partial'){ S.hp -= 12; S.gap -= 8; shake = .3; flash(); toast(E.mid, '−12 health', 'mid'); sfx.mid(); buzz(50); if (S.hp <= 0) die('Bad call at the ' + E.title.toLowerCase() + '.'); }
        else if (S.mode === 'hard'){ S.hp = 0; shake = .8; flash(); toast(E.bad, 'Hardcore: no second chances', 'bad'); sfx.bad(); buzz([80, 40, 120]); die(E.bad.replace('!', '') + '. Hardcore run over.'); }
        else if (S.pw.shield > 0){ S.pw.shield = 0; S.hp -= 12; S.gap -= 8; shake = .4; flash(); toast('Shield took the worst', E.bad.replace('!', '') + ' · −12 health', 'mid'); sfx.shield(); buzz(50); if (S.hp <= 0) die(E.bad.replace('!', '') + '. Wrong path.'); }
        else { S.hp -= 40; S.gap -= 25; shake = .8; flash(); toast(E.bad, '−40 health · tiger gains', 'bad'); sfx.bad(); buzz([80, 40, 120]); if (S.hp <= 0) die(E.bad.replace('!', '') + '. Wrong path.'); }
      }
    }
    const bn = $('banner');
    if (banner){
      if (bn.hidden){ bn.hidden = false; $('bTitle').textContent = EVENTS[banner.ev.type].title; $('bHint').textContent = EVENTS[banner.ev.type].hint; }
      $('bFill').style.width = Math.max(0, (banner.d - 6) / 72 * 100) + '%';
    } else if (!bn.hidden) bn.hidden = true;
    // cleanup
    obs = obs.filter(o => { if (o.z > S.z + 12){ scene.remove(o.g); return false; } return true; });
    items = items.filter(it => { if (it.z > S.z + 12 || it.done){ if (!it.done) scene.remove(it.g); return false; } return true; });
    events = events.filter(e => { if (e.z0 - 14 > S.z + 16){ scene.remove(e.g); return false; } return true; });
    // run cycle + steps
    S.runPhase += dt * v * .62;
    const inWater = events.some(e => e.water && S.z < e.z0 && S.z > e.z0 - 12);
    if (S.y === 0 && S.slide <= 0){ const st = Math.floor(S.runPhase / PI); if (st !== S.lastStep){ S.lastStep = st; sfx.step(inWater); if (inWater) splash(5); else if (!profile.lowGfx || st % 2) dust(1); } }
    if (S.slide > 0 && Math.random() < .5) dust(1, true);
    if (S.y === 0 && S.wasAir){ dust(5, true); shake = Math.max(shake, .12); sfx.land(); }
    S.wasAir = S.y > .05;
    if (rainAmt > .3 && Math.random() < rainAmt * (profile.lowGfx ? .3 : .8)) emit(S.x + (Math.random() - .5) * 9, .05, S.z - 2 - Math.random() * 14, {color: 0xcfe3ef, size: .12, life: .25, grow: 5, alpha: .5});
    S.breathT = (S.breathT || 0) - dt;
    if (S.breathT < 0){ const tired = 1 - S.en / 100; S.breathT = .95 - tired * .45; sfx.breath(tired); }
    if (S.gap < 35){ S.heartT = (S.heartT || 0) - dt; if (S.heartT < 0){ S.heartT = .45 + S.gap / 35 * .45; sfx.heart(); } }
    renderHud();
  } else if (phase === 'intro'){
    S.introT += dt;
    if (S.introT > 1.05 && !S.introRoar){ S.introRoar = true; if (!playS('roar', 1, .85)) sfx.roar(); noise(.5, 900, .25, 'lowpass', 0, 200); shake = .55; buzz([60, 30, 90]); }
    if (S.introT > 1.95) S.z -= dt * 11 * Math.min(1, (S.introT - 1.95) / .5);
    if (S.introT > 2.75) beginChase();
  } else if (phase === 'dying'){
    S.overT += dt;
    if (S.pounce){
      const pp = Math.min(1, S.overT / 1.05);
      if (pp > .62 && !S.hitFx){ S.hitFx = true; shake = .6; flash(); sfx.hit(); buzz([60, 40, 160]); }
    } else S.gap = Math.max(0, S.gap - dt * 60);
    if (S.overT > 1.9){ cine(false); finish(); }
  }

  // decor recycle + ground follow
  for (const d of decor) if (d.position.z > S.z + 14){ placeDecor(d, d.position.z - 160); if (treesReady && d.userData.kind < 2) d.visible = false; }
  if (treesReady){ for (let i = 0; i < treeSlots.length; i++) if (treeSlots[i].z > S.z + 22){ placeTree(treeSlots[i], treeSlots[i].z - 195); writeTree(i); } }
  treeUni.uTime.value = elapsed;
  const sunK = (1 - night) * (1 - rainAmt * .85);
  shaftMat.opacity = .13 * sunK * (profile.lowGfx ? .7 : 1);
  for (const m of shafts){
    if (m.position.z > S.z + 12){ m.position.z -= 168; const side = Math.random() < .5 ? -1 : 1; m.position.x = side * (2.5 + Math.random() * 10); m.scale.x = .6 + Math.random() * 1.2; }
    m.visible = sunK > .05; m.rotation.set(0, Math.atan2(camera.position.x - m.position.x, camera.position.z - m.position.z), m.userData.tilt);
  }
  dapple.position.z = path.position.z; dappleTex.offset.y = -path.position.z / (260 / 30); dappleTex.offset.x = Math.sin(elapsed * .6) * .004;
  dapple.material.opacity = .42 * sunK; dapple.visible = sunK > .05;
  path.position.z = S.z - 100; pathTex.offset.y = -path.position.z / 10;
  if (path.userData.real) path.userData.real.offset.y = -path.position.z / (260 / 15);
  if (path.userData.realN) path.userData.realN.offset.y = path.userData.real ? path.userData.real.offset.y : 0;
  grass.position.z = S.z - 100; grassTex.offset.y = -grass.position.z / 5;
  if (grass.userData.real) grass.userData.real.offset.y = -grass.position.z / (260 / 34);
  sun.position.set(S.x - 6, 14, S.z + 4); sun.target.position.set(S.x, 0, S.z - 10);

  // player pose
  player.position.set(S.x, S.y, S.z);
  const run = S.runPhase;
  body.rotation.set(0, 0, 0); body.position.y = 0;
  if (phase === 'menu'){
    const b = Math.sin(elapsed * 2) * .03; legL.rotation.x = legR.rotation.x = 0; armL.rotation.x = Math.sin(elapsed * 1.5) * .1; armR.rotation.x = -armL.rotation.x; armL.rotation.z = -.1; armR.rotation.z = .1; body.position.y = b;
    head.rotation.y = Math.sin(elapsed * .7) * .3;
  } else if (phase === 'dying' || phase === 'over'){
    body.rotation.x = Math.min(1.5, S.overT * 2.5) * (S.gap <= 0 ? -1 : 1); body.position.y = .2;
    legL.rotation.x = .3; legR.rotation.x = -.2; armL.rotation.x = -2.2; armR.rotation.x = -2.2;
  } else {
    head.rotation.y = 0; armL.rotation.z = 0; armR.rotation.z = 0;
    if (S.slide > 0){ body.rotation.x = 1.15; body.position.y = .32; legL.rotation.x = legR.rotation.x = -1.1; armL.rotation.x = armR.rotation.x = -2.4; }
    else if (S.y > .05){ legL.rotation.x = .9; legR.rotation.x = -.4; armL.rotation.x = -2.4; armR.rotation.x = -2.1; }
    else {
      const s = Math.sin(run); legL.rotation.x = s * .95; legR.rotation.x = -s * .95; armL.rotation.x = -s * .85; armR.rotation.x = s * .85;
      body.position.y = Math.abs(Math.cos(run)) * .09; body.rotation.x = -.12;
    }
    body.rotation.z = (LANES[S.lane] - S.x) * -.12;
  }
  player.visible = !(S.inv > 0 && Math.sin(elapsed * 40) > 0 && phase === 'play');
  shieldBubble.visible = phase === 'play' && S.pw.shield > 0; if (shieldBubble.visible){ shieldBubble.material.opacity = .16 + Math.sin(elapsed * 6) * .06 + (S.pw.shield < 3 ? (Math.sin(elapsed * 20) > 0 ? .1 : -.1) : 0); }
  pShadow.position.set(S.x, .03, S.z); const sh = 1 / (1 + S.y * .5); pShadow.scale.set(.55 * sh, .45 * sh, 1);

  if (hero){
    body.visible = false;
    S.hitT = Math.max(0, (S.hitT || 0) - dt);
    let want = 'idle', once = false;
    if (phase === 'play' || (phase === 'intro' && S.introT > 1.95)){
      want = 'run';
      if (S.slide > 0 && hasAct('slide')){ want = 'slide'; once = true; }
      else if (S.y > .05 && hasAct('jump')){ want = 'jump'; once = true; }
      else if (S.hitT > 0 && hasAct(S.hitKind || 'hit')){ want = S.hitKind || 'hit'; once = true; }
      else if (S.hitT > 0 && hasAct('hit')){ want = 'hit'; once = true; }
    } else if ((phase === 'dying' || phase === 'over') && S.gap <= 0 && hasAct('fall')){ want = 'fall'; once = true; }
    else if ((phase === 'dying' || phase === 'over') && hasAct('death')){ want = 'death'; once = true; }
    else if (phase === 'dying' || phase === 'over') want = 'idle';
    if (curL){
      playAct(want, once, want === 'run' ? .2 : .12);
      const A = curL.acts, slowK2 = S.pw && S.pw.slow > 0 ? .55 : 1;
      if (A.run) A.run.timeScale = S.speed / (curL.def.shared && shared.run ? 13 : 10.5) * (S.stumble > 0 ? .75 : 1) * slowK2 * (S.pw && S.pw.sprint > 0 ? 1.45 : 1);
      if (A.jump) A.jump.timeScale = A.jump.getClip().duration / .8 * slowK2;
      if (A.slide) A.slide.timeScale = A.slide.getClip().duration / .85 * slowK2;
      if (A.hit) A.hit.timeScale = 1.4;
      if (A.hithead) A.hithead.timeScale = 1.5;
    }
    if (mixer) mixer.update(dt);
    hero.rotation.set(0, 0, 0); hero.position.set(0, 0, 0);
    if (phase === 'play'){
      if (S.slide > 0 && !hasAct('slide')){ hero.rotation.x = 1.2; hero.position.y = .35; }
      else if (S.y > .05 && !hasAct('jump')){ hero.rotation.x = -.25; }
      else if (S.y <= .05 && S.slide <= 0) hero.rotation.x = -.06;
      if (S.y > .05 && hasAct('jump')) hero.position.y = -Math.min(S.y, .55);
      hero.rotation.z = (LANES[S.lane] - S.x) * .14;
    } else if ((phase === 'dying' || phase === 'over') && !hasAct('death') && !(S.gap <= 0 && hasAct('fall'))){
      hero.rotation.x = Math.min(1.45, S.overT * 2.4) * (S.gap <= 0 ? -1 : 1);
    }
  }
  // tiger
  tiger.visible = phase !== 'menu';
  let tY = 0;
  if (phase === 'intro'){ const lp = Math.max(0, Math.min(1, (S.introT - 1.05) / .8)), le = lp * lp * (3 - 2 * lp); tigerX = -8 + (S.x + 8) * le; tigerOff = 9 - 3.2 * le; tY = Math.sin(lp * PI) * 1.7 * (lp < 1 ? 1 : 0); }
  else if (phase === 'dying' && S.pounce){ const pp = Math.min(1, S.overT / 1.05); tigerOff = S.pounceFrom + (-.4 - S.pounceFrom) * pp; tY = Math.sin(pp * PI) * 1.7; }
  else if (phase === 'play' && S.entry){
    const lp = Math.min(1, S.t / .65), le = lp * lp * (3 - 2 * lp);
    tigerX = -7 + (S.x + 7) * le; tY = lp < 1 ? Math.sin(lp * PI) * 1.4 : 0;
    if (S.t > .12 && !S.entryRoar){ S.entryRoar = true; if (!playS('roar', 1, .9)) sfx.roar(); shake = .5; buzz([60, 30, 90]); }
    if (S.t > 1.2) tigerOff += ((1.4 + S.gap * .16) - tigerOff) * Math.min(1, dt * 1.6);

  }
  else if (phase !== 'menu') tigerOff += ((1.4 + S.gap * .16) - tigerOff) * Math.min(1, dt * 3.5);
  tiger.position.z = S.z + tigerOff; if (phase === 'intro' || (S.entry && S.t < .65)) tiger.position.x = tigerX; else tiger.position.x += (S.x - tiger.position.x) * Math.min(1, dt * 3);
  tiger.rotation.y = S.entry && S.t < .65 ? -.85 * (1 - S.t / .65) : 0;
  tiger.position.y = tY;
  if (crocMixer) crocMixer.update(dt);
  if (tigerModel){
    tigerMixer.timeScale = phase === 'intro' ? (S.introT < 1.05 ? .12 : 1.1) : phase === 'dying' ? .6 : Math.max(.7, S.speed / 14) * (S.pw && S.pw.slow > 0 ? .55 : 1);
    tigerMixer.update(dt);
    tigerModel.rotation.x = phase === 'dying' && S.pounce ? (Math.min(1, S.overT / 1.05) < .5 ? -.45 : .35) : 0;
  }
  const gf = elapsed * 11.5;
  tLegs.forEach(L => { const a = gf + L.ph; L.hip.rotation.x = Math.sin(a) * .8; L.knee.rotation.x = (L.front ? -1 : 1) * Math.max(0, Math.sin(a - 1.1)) * 1.15; });
  tBody.rotation.x = phase === 'dying' ? -.45 : Math.sin(gf) * .07;
  tBody.position.y = Math.abs(Math.sin(gf)) * .08;
  tHead.rotation.x = Math.sin(gf + 1) * .06;
  tailSegs.forEach((sg, i) => { sg.rotation.y = Math.sin(elapsed * 4 - i * .55) * .22; sg.rotation.x = i ? .06 : .9; });
  tJaw.rotation.x = phase === 'dying' ? .7 : (S.gap < 28 ? Math.max(0, Math.sin(elapsed * 5)) * .45 : 0);

  // camera
  if (phase === 'menu'){
    menuAngle += dt * .35;
    const narrow = window.innerHeight / window.innerWidth > 1.5;

    camera.lookAt(S.x, narrow ? -1.0 : .2, S.z);
  } else if (phase === 'intro'){
    const sw = Math.max(0, Math.min(1, (S.introT - 1.9) / .85)), se = sw * sw * (3 - 2 * sw);
    const th = 2.75 + (.22 - 2.75) * se, R2 = 3.9 + se * .8;

    if (shake > 0){ shake = Math.max(0, shake - dt); camera.position.x += (Math.random() - .5) * shake * .6; camera.position.y += (Math.random() - .5) * shake * .6; }
    const lk = Math.max(0, Math.min(1, (S.introT - 1.0) / .5)) * (1 - se);

  } else if (phase === 'dying' || phase === 'over'){
    camGoal.set(S.x + 3.4, 1.5, S.z + 1.6);
    camera.position.lerp(camGoal, 1 - Math.pow(.05, dt));
    if (shake > 0){ shake = Math.max(0, shake - dt); camera.position.x += (Math.random() - .5) * shake; camera.position.y += (Math.random() - .5) * shake; }
    camera.lookAt(S.x, .9, S.z + .2);
  } else {
    const close = Math.max(0, 45 - S.gap);
    const back = 4.6 + close * .085;
    camGoal.set(S.x * .7, 2.75 + (S.slide > 0 ? -.55 : 0) + S.y * .35 + close * .055, S.z + back);
    camera.position.lerp(camGoal, 1 - Math.pow(.0008, dt));
    if (shake > 0){ shake = Math.max(0, shake - dt); camera.position.x += (Math.random() - .5) * shake; camera.position.y += (Math.random() - .5) * shake; }
    if (phase === 'play' && S.y === 0 && S.slide <= 0){ camera.position.y += Math.abs(Math.sin(S.runPhase)) * .07 - .035; camera.position.x += Math.sin(S.runPhase) * .03; }
    camera.lookAt(S.x * .55, 1.45, S.z - 8);
    camera.rotateZ((LANES[S.lane] - S.x) * .022 - BEND.value.x * 22);
    const fovT = baseFov + (phase === 'play' ? (S.speed - 14) * .55 + (S.pw.sprint > 0 ? 14 : 0) : 0); if (Math.abs(camera.fov - fovT) > .05){ camera.fov += (fovT - camera.fov) * Math.min(1, dt * 2); camera.updateProjectionMatrix(); }
    drawLines(phase === 'play' ? (S.pw.sprint > 0 ? 1.4 : Math.max(0, (S.speed - 15) / 11)) : 0);
  }
  const dang = phase === 'play' ? Math.max(0, (40 - S.gap) / 40) : 0;
  $('vignette').style.opacity = composer && !profile.lowGfx ? dang * .35 : dang * .9;
  if (gradePass){ gradePass.uniforms.time.value = elapsed % 10; gradePass.uniforms.danger.value = dang; gradePass.uniforms.warm.value = .5 * (1 - night); gradePass.uniforms.exposure.value = 1 + night * .4; }
  nearCD = Math.max(0, nearCD - dt);
  const bendOn = phase === 'menu' ? 0 : 1, bd = S.dist;
  bendTX = (Math.sin(bd * .0043 + .6) * .0017 + Math.sin(bd * .0011) * .0007) * bendOn;
  bendTY = (Math.sin(bd * .0029 + 2.1) * .0008 - .0001) * bendOn;
  BEND.value.x += (bendTX - BEND.value.x) * Math.min(1, dt * 1.5);
  BEND.value.y += (bendTY - BEND.value.y) * Math.min(1, dt * 1.5);
}

function checkMissions(){
  let changed = false;
  for (const m of profile.missions){
    if (m.done) continue;
    const d = MISSION_POOL.find(p => p.id === m.id);
    if (d && S.st[d.stat] >= d.n){ m.done = true; changed = true; S.misDone++; profile.wallet += 50; sfx.good(); toast('Mission complete', d.text + ' · +50 coins', 'good'); }
  }
  if (changed) saveProfile();
}
let hudCache = {};
function setW(id, v){ const s = Math.round(v); if (hudCache[id] !== s){ hudCache[id] = s; $(id).style.width = Math.max(0, s) + '%'; } }
function renderHud(){
  setW('hpFill', S.hp); setW('enFill', S.en); setW('waFill', S.wa); setW('tgFill', 100 - S.gap);
  $('hpBar').classList.toggle('low', S.hp < 30); $('enBar').classList.toggle('low', S.en < 20); $('waBar').classList.toggle('low', S.wa < 20);
  const act = Object.keys(S.pw).filter(k => S.pw[k] > 0);
  const key = act.map(k => k + Math.ceil(S.pw[k])).join();
  if (hudCache.pw !== key){ hudCache.pw = key; $('powers').innerHTML = act.map(k => { const P = POWERS[k]; return `<div class="pchip" style="--pc:${P.css}"><b>${P.name} ${Math.ceil(S.pw[k])}s</b><div class="pt"><i style="width:${S.pw[k] / P.dur * 100}%"></i></div></div>`; }).join(''); }
  $('tigerWrap').classList.toggle('close', S.gap < 30);
  const d = Math.floor(S.dist); if (hudCache.d !== d){ hudCache.d = d; $('dist').innerHTML = d + '<small>m</small>'; }
  if (hudCache.c !== S.coins){ hudCache.c = S.coins; $('coins').textContent = S.coins + ' coins'; }
}

let baseFov = 62;
const lc = $('lines'), lx = lc.getContext('2d');
function drawLines(a){
  lx.clearRect(0, 0, lc.width, lc.height);
  if (a <= .01) return;
  const w = lc.width, h = lc.height, cx = w / 2, cy = h * .42;
  lx.strokeStyle = 'rgba(255,255,255,' + (a * .22).toFixed(3) + ')'; lx.lineWidth = 1.5;
  for (let i = 0; i < 26; i++){ const ang = Math.random() * 6.283, r0 = Math.max(w, h) * (.38 + Math.random() * .2), r1 = r0 + 40 + Math.random() * 90; lx.beginPath(); lx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0); lx.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1); lx.stroke(); }
}
function resize(){ const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); if (composer){ composer.setSize(w, h); bloomPass && bloomPass.setSize(w / 2, h / 2); } camera.aspect = w / h; baseFov = w / h < .7 ? 72 : 62; camera.fov = baseFov; camera.updateProjectionMatrix(); lc.width = w; lc.height = h; }
window.addEventListener('resize', resize);
function loop(){
  const raw = Math.min(.05, clock.getDelta());
  if (slowT > 0){ slowT -= raw; timeScale += (.32 - timeScale) * Math.min(1, raw * 14); } else timeScale += (1 - timeScale) * Math.min(1, raw * 6);
  if (phase !== 'paused') update(raw * timeScale);
  if (composer && !profile.lowGfx) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

window.__ws = {get S(){ return S; }, BEND, camera, scene, path, grass, get phase(){ return phase; }};
S = freshState(); resize(); renderPickers(); renderBest(); syncMute(); loadChars(); loadTiger(); loadCroc(); loadTrees(); setupComposer(); applyGfx(); renderMenu();
loop();
})();
