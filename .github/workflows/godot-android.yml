name: Build Godot Android (3D test)

on:
  push:
    branches: [main]
    paths: ['godot/**', '.github/workflows/godot-android.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Download Godot and Android export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q g.zip && rm g.zip && mv Godot_v* godot
          curl -sSL -o t.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T
          unzip -q -j t.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/version.txt' -d $T
          rm t.tpz
          ls -la $T

      - name: Editor settings (Android SDK + Java)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i 's/^ *//' ~/.config/godot/editor_settings-4.7.tres

      - name: Import and export APK
        working-directory: godot
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android/app/debug-shared.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.${{ github.run_number }}\"/" export_presets.cfg
          mkdir -p build
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --export-debug "Android" build/WildSurvivor3D-test-${{ github.run_number }}.apk
          ls -la build

      - name: Publish test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-${{ github.run_number }}
          name: Wild Survivor 3D (Godot test ${{ github.run_number }})
          prerelease: true
          make_latest: false
          body: |
            Godot engine test level. Open on your phone and tap the .apk to install.
            It installs as a separate app ("Wild Survivor 3D"), next to the current game.
          files: godot/build/*.apk
