name: Build Android

on:
  push:
    branches: [main]
    paths-ignore: ['godot/**', '.github/workflows/godot-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install packages
        run: npm ci

      - name: Copy game into Android project
        run: npx cap sync android

      - name: Build installable APK (for testing on your phone)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # Play Store build. Runs only after you add the 4 signing secrets (see README).
      - name: Build signed AAB for Play Store
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "No signing secrets yet - skipping Play Store build."; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon bundleRelease

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/WildSurvivor-1.0.${VERSION_CODE}.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/WildSurvivor-1.0.${VERSION_CODE}.aab"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: wild-survivor-${{ github.run_number }}
          path: out/*

      - name: Publish download on Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wild Survivor 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Open this page on your phone and tap **WildSurvivor-1.0.${{ github.run_number }}.apk** to download and install.
            (Android will ask to allow installs from your browser the first time.)
          files: out/*
